[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpro-core"
version = "0.1.0"
description = "Aggregator application foundation for the WL Tech Bench Pro ecosystem"
authors = [
    { name = "WL Tech" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0",
]

[project.scripts]
benchpro-core = "benchpro_core.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "integration: tests that use installed external Bench Pro modules",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]



